<section class="content">
  <ngx-spinner size="medium" [type]="typeSelected">
    <p style="font-size: 20px; color: white">Loading...</p>
  </ngx-spinner>

  <mat-card style="z-index: 9;">
    <div class="row" style="display: flex; justify-content: space-between;">
      <div class="col-sm-4 col-lg-12 col-md-4">
        <p class="tr-title">Ticketing Report</p>
      </div>
    </div>

    <div class="tr-filter-row">
      <div class="tr-field">
        <label>Ticket No</label>
        <input type="text" class="tr-input" placeholder="Enter Ticket No" [(ngModel)]="TicketNo" />
      </div>

      <div class="tr-field">
        <label>Case Id</label>
        <input type="text" class="tr-input" placeholder="Enter Case ID" [(ngModel)]="CaseId" />
      </div>

      <div class="tr-field tr-daterange">
        <mat-form-field appearance="fill" style="width: 100%;">
          <mat-label style="padding-top: 3px; font-weight: 600;">Enter a date range</mat-label>
          <div style="display: flex; align-items: center; justify-content: space-between;">
            <div>
              <mat-date-range-input [rangePicker]="picker">
                <input matStartDate [(ngModel)]="StartDate" placeholder="Start date">
                <input matEndDate [(ngModel)]="EndDate" placeholder="End date">
              </mat-date-range-input>
            </div>
            <div>
              <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
              <mat-date-range-picker #picker></mat-date-range-picker>
            </div>
          </div>
        </mat-form-field>
      </div>
    </div>

    <div class="tr-actions">
      <button type="button" (click)="exportReportData()" class="btn tr-export-btn">Export Report</button>
      <button type="button" (click)="getReportData({})" class="btn btnClass">Generate Report</button>
    </div>
  </mat-card>

  <mat-card class="mt-2" *ngIf="(detail | async)?.Data?.length > 0">
    <div class="table-responsive">
      <nitc-grid [gridcolumns]="columns" [dataSource]="detail" [hideSpinnerEvents]="hideSpinnerEvent" (changeEvent)="PageChange($event)" [isAllowSelect]="false">
      </nitc-grid>
    </div>
  </mat-card>
</section>
